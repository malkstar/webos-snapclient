# Ready-to-file file for webosbrew/apps-repo: packages/com.github.malkstar.snapclient.yml
# (see docs/SUBMISSION.md for the full pre-submission checklist)
title: Snapclient
iconUri: https://raw.githubusercontent.com/malkstar/webos-snapclient/main/src/app/largeIcon.png
manifestUrl: https://github.com/malkstar/webos-snapclient/releases/latest/download/com.github.malkstar.snapclient.manifest.json
category: multimedia
pool: main
shortDescription: Snapcast audio client with millisecond-accurate multi-room sync; runs as a background daemon.
requirements:
  webosRelease: '>=4.0'
description: |
  Snapcast client for LG webOS TVs — plays audio streamed from a Snapcast
  server with millisecond-accurate sync across multiple clients.

  Install, open the app once to set the server address and start the daemon,
  and (optionally) enable autostart. Requires a rooted TV with Homebrew
  Channel. The packaged binary is the Debian armel build from upstream
  [Snapcast](https://github.com/snapcast/snapcast) (GPL-3.0); see the
  [packaging repo](https://github.com/malkstar/webos-snapclient) for the recipe.
funding:
  github: [ malkstar ]
